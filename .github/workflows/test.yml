# Runs the full suite on every PR and on main. The suites are offline (the exchange is
# mocked) and dependency-free, so this is just node + the repo. Node 22.13+ for node:sqlite.
# A push to a PR's branch runs once (as the PR), not twice (as a push and as the PR), and a
# newer push cancels the run it replaces: the runners this repo gets go to the latest commit.
name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  # The real app in a real Chromium, served by the real server, offline (e2e/run.mjs).
  # Playwright is installed here only — the app and server still have no dependencies.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      # CI runners are slower than a laptop; the budgets still catch a page that got slow
      - run: npm run test:e2e
        env:
          E2E_SLOW: '2'
      # a ~18k-trade account (e2e/heavy.mjs): real budgets on import, render, each tab and the
      # longest main-thread task, so the heavy-account work can't quietly regress
      - run: npm run test:e2e:heavy
        env:
          E2E_SLOW: '2'
